<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Location | 17 October 2026</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">


    <style>

        /* ================================
           GLOBAL
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #f8f4ed;
            color: #4b1721;
            font-family: "Cormorant Garamond", serif;
            overflow-x: hidden;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .location-page {
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }


        /* ================================
           DECORATIVE BACKGROUND
        ================================= */

        .location-page::before,
        .location-page::after {
            content: "";
            position: fixed;
            width: 220px;
            height: 220px;
            border: 1px solid rgba(160, 120, 55, 0.35);
            border-radius: 50%;
            pointer-events: none;
        }

        .location-page::before {
            top: -100px;
            left: -100px;
        }

        .location-page::after {
            bottom: -100px;
            right: -100px;
        }


        /* ================================
           CARD
        ================================= */

        .location-card {
            width: 100%;
            max-width: 900px;
            background: #fffdf9;
            border: 1px solid #b08a45;
            padding: 55px 50px;
            text-align: center;
            position: relative;
            box-shadow:
                0 20px 60px rgba(70, 20, 30, 0.12);
        }

        /* Inner border */

        .location-card::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(176, 138, 69, 0.45);
            pointer-events: none;
        }


        /* ================================
           TOP TEXT
        ================================= */

        .bismillah {
            font-family: "Amiri", serif;
            font-size: 30px;
            color: #8f2636;
            margin-bottom: 15px;
        }

        .small-title {
            font-size: 13px;
            letter-spacing: 4px;
            color: #9b7940;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-family: "Great Vibes", cursive;
            font-size: clamp(48px, 7vw, 75px);
            font-weight: 400;
            color: #741d2b;
            line-height: 1.1;
        }

        .date {
            margin-top: 12px;
            font-size: 19px;
            letter-spacing: 2px;
            color: #76533a;
        }


        /* ================================
           ORNAMENT
        ================================= */

        .ornament {
            margin: 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .ornament span {
            display: block;
            width: 7px;
            height: 7px;
            background: #b08a45;
            transform: rotate(45deg);
        }

        .ornament::before,
        .ornament::after {
            content: "";
            width: 70px;
            height: 1px;
            background: #b08a45;
        }


        /* ================================
           LOCATION TITLE
        ================================= */

        .venue-title {
            font-size: 27px;
            font-weight: 600;
            color: #741d2b;
            margin-bottom: 8px;
        }

        .venue-subtitle {
            font-size: 17px;
            color: #806654;
            margin-bottom: 25px;
        }


        /* ================================
           MAP
        ================================= */

        .map-container {
            width: 100%;
            overflow: hidden;
            border: 1px solid #b08a45;
            padding: 6px;
            background: #fff;
            box-shadow: 0 12px 35px rgba(70, 20, 30, 0.12);
        }

        .map-container iframe {
            width: 100%;
            height: 450px;
            display: block;
            border: 0;
        }


        /* ================================
           BACK BUTTON
        ================================= */

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            border: 1px solid #8f2636;
            color: #8f2636;
            text-decoration: none;
            font-size: 16px;
            letter-spacing: 1px;
            transition: 0.3s ease;
            background: transparent;
        }

        .back-button:hover {
            background: #8f2636;
            color: #fff;
        }


        /* ================================
           FOOTER
        ================================= */

        .footer-text {
            margin-top: 28px;
            font-size: 15px;
            color: #927a68;
            font-style: italic;
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 700px) {

            .location-page {
                padding: 30px 15px;
            }

            .location-card {
                padding: 45px 25px;
            }

            .map-container iframe {
                height: 380px;
            }

            .bismillah {
                font-size: 26px;
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 480px) {

            .location-page {
                padding: 20px 10px;
            }

            .location-card {
                padding: 38px 15px;
            }

            .location-card::before {
                inset: 8px;
            }

            .small-title {
                font-size: 10px;
                letter-spacing: 3px;
            }

            h1 {
                font-size: 52px;
            }

            .date {
                font-size: 16px;
            }

            .venue-title {
                font-size: 23px;
            }

            .venue-subtitle {
                font-size: 15px;
            }

            .map-container {
                padding: 4px;
            }

            .map-container iframe {
                height: 330px;
            }

            .ornament::before,
            .ornament::after {
                width: 45px;
            }

            .back-button {
                padding: 11px 24px;
                font-size: 15px;
            }

        }


        /* ================================
           VERY SMALL PHONES
        ================================= */

        @media (max-width: 350px) {

            .location-card {
                padding: 35px 12px;
            }

            h1 {
                font-size: 45px;
            }

            .map-container iframe {
                height: 300px;
            }

        }

    </style>
</head>


<body>

    <main class="location-page">

        <section class="location-card">

            <!-- Bismillah -->
            <div class="bismillah">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
            </div>


            <!-- Heading -->
            <div class="small-title">
                You Are Cordially Invited
            </div>

            <h1>
                Wedding Location
            </h1>

            <div class="date">
                17 October 2026
            </div>


            <!-- Ornament -->
            <div class="ornament">
                <span></span>
            </div>


            <!-- Venue -->
            <h2 class="venue-title">
                Nikah &amp; Walima
            </h2>

            <p class="venue-subtitle">
                We look forward to celebrating this beautiful day with you.
            </p>


            <!-- Google Map -->
            <div class="map-container">

                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d4408.247624402531!2d91.041595!3d26.112761!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjbCsDA2JzQ1LjkiTiA5McKwMDInMjkuNyJF!5e1!3m2!1sen!2sin!4v1789201324647!5m2!1sen!2sin"
                    width="600"
                    height="450"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>


            <!-- Back -->
            <a href="index.html" class="back-button">
                ← Back to Invitation
            </a>


            <p class="footer-text">
                Your presence will make our celebration even more special.
            </p>

        </section>

    </main>

</body>
</html>
